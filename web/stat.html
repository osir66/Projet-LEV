<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Statistiques - Massilia</title>
    <link rel="stylesheet" href="/front/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-title">Menu</div>
        <nav>
            <ul>
                <li><a href="/stat" class="active">Stat</a></li>
                <li><a href="/commande">Commande</a></li>
            </ul>
        </nav>
    </aside>

    <div class="page-content">
        <h1 style="text-align: center; margin-bottom: 50px;">Tableau de bord Massilia</h1>
        <div class="stat_equipe">
            <div class="card">
                <span class="stat_label">Robots</span>
                <span class="stat_number">__COUNT_ROBOTS__</span>
            </div>
            <div class="card">
                <span class="stat_label">Sémaphores</span>
                <span class="stat_number">__COUNT_SEMAPHORES__</span>
            </div>
            <div class="card">
                <span class="stat_label">Formes</span>
                <span class="stat_number">__COUNT_FORMES__</span>
            </div>
            <div class="card">
                <span class="stat_label">Missions</span>
                <span class="stat_number">__COUNT_MISSIONS__</span>
            </div>
        </div>
    </div>

</body>
</html>
